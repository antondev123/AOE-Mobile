<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTS deploy smoke test</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #111;
    color: #eee;
  }
  h1 { font-size: clamp(1.5rem, 6vw, 3rem); margin: 0; }
  dl { display: grid; grid-template-columns: auto auto; gap: 0.25rem 1rem; margin: 0; font-size: 0.9rem; }
  dt { color: #888; }
  dd { margin: 0; }
</style>
</head>
<body>
  <h1>RTS deploy works</h1>
  <dl>
    <dt>commit</dt><dd id="commit">__COMMIT_SHA__</dd>
    <dt>built</dt><dd id="built">__BUILD_TIME__</dd>
  </dl>
</body>
</html>
