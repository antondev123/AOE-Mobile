server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # What fly.toml's http check calls. Deliberately before any location that
    # could rewrite it, and deliberately not logged: 2,880 hits a day of "GET
    # /healthz 200" is the whole access log otherwise.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The game is ES modules loaded straight by the browser — no bundler — so a
    # wrong MIME type on one file is a blank screen rather than a slow page.
    # nginx's stock mime.types already maps .js and .css; this is here for the
    # ones it does not, and to be explicit about the module case.
    types {
        text/html                             html;
        text/css                              css;
        text/javascript                       js mjs;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;

    # index.html is the only file whose name never changes AND whose contents do
    # (it carries the build stamp), so it is the one file that must not be held
    # in a cache the player cannot clear. Everything under src/ and vendor/ is
    # revalidated rather than cached hard for the same reason: this project has
    # no content hashing in its filenames, so a long max-age would pin a player
    # to whichever build they happened to open first.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The generated art means the page pulls no third-party anything; say so.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
