# The app was created and deployed by hand, and its configuration lived only in
# Fly's copy of it — so there was no way to reproduce a deploy from the
# repository, and no way to review a change to it. This file is that
# configuration, written down to match what is already running (`fly config
# show --app aoe-mobile`) rather than to change it.

app = 'aoe-mobile'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # A static page with no cold-start work worth speaking of, but the game holds
  # its save in localStorage rather than on a server, so there is nothing for a
  # stopped machine to lose and nothing for a started one to warm up. Kept as it
  # was found: one machine always up, which is the cheapest way to never make a
  # player wait for a boot.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 200

  # nginx answers this without touching disk; see nginx.conf.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
